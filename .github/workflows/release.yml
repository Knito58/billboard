# Builds the mod and publishes a GitHub release when a version tag (v1.0.0, ...) is pushed.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Check that the tag matches the mod version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version=$version in gradle.properties"; exit 1; }
      - name: Build
        run: ./gradlew build --no-configuration-cache
      - uses: softprops/action-gh-release@v2
        with:
          name: Billboard ${{ github.ref_name }} for Minecraft 26.3
          body_path: CHANGELOG.md
          files: |
            build/libs/billboard-*.jar
            !build/libs/billboard-*-sources.jar
