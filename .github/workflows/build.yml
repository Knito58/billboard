# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: Build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build Billboard API into the local maven repository
        # Billboard API is not on a public maven yet; build the branch or tag named in gradle.properties.
        run: |
          ref=$(grep '^billboard_api_ref=' gradle.properties | cut -d= -f2)
          git clone --depth 1 --branch "$ref" https://github.com/Knito58/Billboard-API.git ../billboard-api
          (cd ../billboard-api && chmod +x ./gradlew && ./gradlew publishToMavenLocal --no-daemon)
          mkdir -p build/api && cp ../billboard-api/build/libs/billboard-api-*.jar build/api/
          rm -f build/api/*-sources.jar
      - name: build
        run: |
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log
      - name: show compile errors on the pull request
        if: failure()
        run: |
          # javac prints "path:line: error: message" with a few lines of details below it
          python3 - <<'PY'
          import os, re
          ws = os.environ["GITHUB_WORKSPACE"] + "/"
          lines = open("build.log", encoding="utf-8", errors="replace").read().splitlines()
          for i, l in enumerate(lines):
              m = re.match(r"^(/\S+\.java):(\d+): error: (.*)$", l)
              if m:
                  details = [d for d in lines[i + 1:i + 4] if not re.match(r"^(/\S+\.java:\d+:|\d+ errors?$)", d)]
                  msg = "%0A".join([m.group(3)] + details).replace("%", "%25").replace("%250A", "%0A")
                  print(f"::error file={m.group(1).replace(ws, '')},line={m.group(2)}::{msg}")
          # Failed game tests and Gradle's own summary, so they show up without the job log
          esc = lambda t: t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          for i, l in enumerate(lines):
              if re.search(r"GameTest.*(fail|Fail|FAIL)|test\.[a-z_]+.*fail|GameTestAssert|Exception|Caused by", l):
                  print("::error title=Game test::" + esc("\n".join(lines[i:i + 4]).strip()[:8000]))
              if l.startswith("* What went wrong:"):
                  print("::error title=Gradle::" + esc("\n".join(lines[i + 1:i + 10])[:900]))
          PY
      - name: start a server to check the mod's data files, without and with Billboard API
        # Recipes, advancements etc. are only checked when a world loads, not by the build.
        # Billboard API is optional, so the engine must start alone and together with it.
        run: |
          mkdir -p run && echo "eula=true" > run/eula.txt
          for pass in without with; do
            if [ "$pass" = with ]; then
              rm -rf run/world
              mkdir -p run/mods && cp build/api/billboard-api-*.jar run/mods/
            fi
            ./gradlew runServer --no-daemon > server-$pass.log 2>&1 &
            for i in $(seq 1 120); do
              sleep 5
              if grep -qE "Done \(|Failed to load datapacks|Failed to load registries|Exception in server tick|agree to the EULA" server-$pass.log; then break; fi
            done
            pkill -f runServer || true
            pkill java || true
            sleep 5
            if ! grep -q "Done (" server-$pass.log; then
              grep -nE -A20 "ERROR|Failed" server-$pass.log | head -150
              echo "::error::The server did not start with the mod loaded ($pass Billboard API)"
              exit 1
            fi
            if [ "$pass" = with ] && ! grep -q "Billboard API found" server-$pass.log; then
              echo "::error::Billboard API was in run/mods but the engine did not register with it"
              exit 1
            fi
            # Warnings about the mod's data (e.g. a loot table the game rejected) don't stop the server
            grep -iE "billboard" server-$pass.log | grep -iE "warn|error|fail|invalid|validation" | head -20 | sed "s/^/::warning title=Server log ($pass API)::/" || true
            echo "Server started fine $pass Billboard API"
          done
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          # The engine jar and the Billboard API jar it was built against, ready for a mods folder
          path: |
            build/libs/
            build/api/
